name: "Tests"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Monthly, so the badge always has a recent run on main to show.
  schedule:
    - cron: '0 6 1 * *'
permissions:
  contents: "read"
jobs:
  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-progress --ignore-platform-req=ext-eusphpe
      - name: Check PHP syntax
        # `php -l <dir>` lints nothing, so lint file by file
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run tests
        run: vendor/bin/phpunit
  keepalive:
    # GitHub disables scheduled workflows after 60 days without repository activity
    name: Keep the schedule enabled
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        run: gh workflow enable tests.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
